<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Joshua's Art Website</title>
  <link href="Blank1200px.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div id="wrapper">
    
    <!-- Top Header Bar -->
    <header>
      <h1>Joshua's Art Website!</h1>
      <a href="https://canvas.illinoisstate.edu/profile" class="header-link">About Me</a>
    </header>

    
    <main>
      <!-- Column 1: Web Design -->
      <section class="column col-red">
        <h2 class="col-title">Web Design</h2>
        <h3 class="col-course">CTK 231</h3>

        <article class="project-card">
          <h4>Basic CSS</h4>
          <img src="basic-css.png" alt="Basic CSS project">
        </article>

        <article class="project-card">
          <h4>Advanced CSS</h4>
          <img src="advanced-css.png" alt="Advanced CSS project">
        </article>

        <article class="project-card">
          <h4>Midterm</h4>
          <img src="midterm.png" alt="Midterm project">
        </article>
      </section>

      <!-- Column 2: Videos -->
      <section class="column col-blue">
        <h2 class="col-title">Videos</h2>
        <h3 class="col-course">CTK 330</h3>

        <article class="project-card">
          <h4>One Day</h4>
          <img src="one-day.jpg" alt="One Day video project">
        </article>

        <article class="project-card">
          <h4>Editing</h4>
          <img src="editing.jpg" alt="Editing video project">
        </article>

        <article class="project-card">
          <h4>Texts &amp; Titles</h4>
          <img src="texts-titles.jpg" alt="Texts and Titles project">
        </article>
      </section>

      <!-- Column 3: Music -->
      <section class="column col-green">
        <h2 class="col-title">Music</h2>
        <h3 class="col-course">CTK 345</h3>

        <article class="project-card">
          <h4>2-track song</h4>
          <img src="2-track.png" alt="2-track song DAW session">
        </article>

        <article class="project-card">
          <h4>4-track song</h4>
          <img src="4-track.png" alt="4-track song DAW session">
        </article>

        <article class="project-card">
          <h4>8-track song</h4>
          <img src="8-track.png" alt="8-track song DAW session">
        </article>
      </section>

      <!-- Column 4: Drawings -->
      <section class="column col-yellow">
        <h2 class="col-title">Drawings</h2>
        <h3 class="col-course">ART 104</h3>

        <article class="project-card">
          <h4>Sketch 1</h4>
          <img src="IMG_2920.jpg" alt="Drawing Sketch 1">
        </article>

        <article class="project-card">
          <h4>Sketch 2</h4>
          <img src="IMG_2921.jpg" alt="Drawing Sketch 2">
        </article>

        <article class="project-card">
          <h4>Sketch 3</h4>
          <img src="IMG_2922.jpg" alt="Drawing Sketch 3">
        </article>
      </section>

    </main>

    <!-- Bottom Footer Bar -->
    <footer>
      <span>Footer</span>
      <a href="mailto:jperry7@ilstu.edu">Contact &#x2709;</a>
      <a href="http://www.youtube.com/@jjperry2026">Socials &#x25B6;</a>
    </footer>

  </div>
</body>
</html>
